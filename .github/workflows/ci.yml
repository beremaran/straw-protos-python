name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.8.22
          enable-cache: true
      - name: Reject manual generated changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -Eq '^straw_protos/straw/v1/straw_pb2\.(py|pyi)$'; then
            case "$HEAD_REF" in automation/protos-*) ;; *) echo 'generated files may only change through automation'; exit 1;; esac
          fi
      - run: uv sync --frozen
      - run: make check

