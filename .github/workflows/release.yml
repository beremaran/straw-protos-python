name: Release matching binding

on:
  push:
    branches: [main]
    paths: [PROVENANCE.json]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.STRAW_RELEASE_APP_ID }}
          private-key: ${{ secrets.STRAW_RELEASE_APP_PRIVATE_KEY }}
          owner: beremaran
          repositories: straw-protos-python,straw-sdk-python
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.8.22
      - name: Validate provenance and release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          tag=$(jq -r .source_tag PROVENANCE.json)
          source_sha=$(jq -r .source_commit PROVENANCE.json)
          test -n "$tag"
          test "$tag" != null
          test "$(jq -r .reproducibility PROVENANCE.json)" = 'generated twice identically and tests passed'
          uv sync --frozen
          make check
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            existing=$(gh release view "$tag" --json body --jq .body)
            printf '%s' "$existing" | grep -q "$source_sha"
          else
            gh release create "$tag" --title "$tag" --notes "Generated code. Source straw-protos tag: $tag; source commit: $source_sha; generators: protocolbuffers/python and pyi v33.5; Buf: 1.50.0; reproducibility, tests, and package build: passed; generated repository commit: $GITHUB_SHA. No artifact was published externally."
          fi
          gh api repos/beremaran/straw-sdk-python/dispatches -f event_type=python-binding-release -F "client_payload[tag]=$tag"
