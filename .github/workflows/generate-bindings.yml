name: Generate bindings

on:
  workflow_dispatch:
    inputs:
      source_tag:
        required: true
      source_sha:
        required: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.STRAW_RELEASE_APP_ID }}
          private-key: ${{ secrets.STRAW_RELEASE_APP_PRIVATE_KEY }}
          owner: beremaran
          repositories: straw-protos,straw-protos-python
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: binding
          fetch-depth: 0
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: beremaran/straw-protos
          ref: ${{ inputs.source_tag }}
          token: ${{ steps.app-token.outputs.token }}
          path: source
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.8.22
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.50.0
      - name: Verify source and generate twice
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git -C source rev-list -n 1 "$SOURCE_TAG")" = "$SOURCE_SHA"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          cd binding
          buf generate ../source --template buf.gen.yaml
          first=$(shasum -a 256 straw_protos/straw/v1/straw_pb2.py straw_protos/straw/v1/straw_pb2.pyi)
          buf generate ../source --template buf.gen.yaml
          test "$first" = "$(shasum -a 256 straw_protos/straw/v1/straw_pb2.py straw_protos/straw/v1/straw_pb2.pyi)"
          jq -n \
            --arg tag "$SOURCE_TAG" --arg source "$SOURCE_SHA" --arg config "${{ github.sha }}" \
            '{source_repository:"github.com/beremaran/straw-protos",source_tag:$tag,source_commit:$source,generators:["protocolbuffers/python:v33.5","protocolbuffers/pyi:v33.5"],buf_version:"1.50.0",generation_config_revision:$config,generated_repository_commit:"pending",reproducibility:"generated twice identically and tests passed",generated_code_notice:"straw_pb2.py and straw_pb2.pyi are generated; do not edit manually"}' > PROVENANCE.json
          uv lock
          uv sync --frozen
          make check
      - name: Open generated pull request
        working-directory: binding
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          branch="automation/protos-${SOURCE_TAG#v}"
          git config user.name 'Straw Release Automation[bot]'
          git config user.email 'straw-release-automation[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add straw_protos/straw/v1/straw_pb2.py straw_protos/straw/v1/straw_pb2.pyi PROVENANCE.json uv.lock
          git commit -m "Generate bindings from $SOURCE_TAG"
          git push -u origin "$branch"
          gh pr create --title "Generate bindings from $SOURCE_TAG" --body "Generated from exact private protocol tag $SOURCE_TAG. Provenance, reproducibility, package tests, and build checks are recorded. Generated files must not be edited manually." --base main --head "$branch"

